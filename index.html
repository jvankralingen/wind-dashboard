<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="header-top">
                <h1>Wind Dashboard</h1>
                <button class="settings-btn" id="settingsBtn" aria-label="Instellingen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
            <div class="spot-nav">
                <span class="spot-name" id="spotName">IJmuiden</span>
                <div class="spot-dots" id="spotDots">
                    <!-- Wordt gevuld door JS -->
                </div>
            </div>
            <p class="update-time" id="updateTime">Laden...</p>
        </header>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>Instellingen</h3>
                <button class="settings-close" id="settingsClose">×</button>
            </div>
            <div class="settings-content">
                <div class="settings-group">
                    <label class="settings-label">Windeenheid</label>
                    <div class="unit-switcher">
                        <button class="unit-btn active" data-unit="kn">Knopen</button>
                        <button class="unit-btn" data-unit="bft">Beaufort</button>
                        <button class="unit-btn" data-unit="ms">m/s</button>
                    </div>
                </div>
                <div class="settings-group">
                    <label class="settings-label">Spots</label>
                    <div class="spot-list" id="spotList">
                        <!-- Wordt gevuld door JS -->
                    </div>
                </div>

                <div class="settings-group">
                    <label class="settings-label">Mijn Zeilen</label>
                    <div class="gear-config-list" id="sailsList">
                        <!-- Wordt gevuld door JS -->
                    </div>
                    <button class="gear-add-btn" id="addSailBtn">+ Zeil toevoegen</button>
                </div>

                <div class="settings-group">
                    <label class="settings-label">Mijn Boards</label>
                    <div class="gear-config-list" id="boardsList">
                        <!-- Wordt gevuld door JS -->
                    </div>
                    <button class="gear-add-btn" id="addBoardBtn">+ Board toevoegen</button>
                </div>
            </div>
        </div>
        <div class="settings-overlay" id="settingsOverlay"></div>

        <!-- Gear Panel -->
        <div class="gear-panel" id="gearPanel">
            <div class="gear-panel-header">
                <h3>Mijn Gear</h3>
                <button class="gear-panel-close" id="gearPanelClose">×</button>
            </div>
            <div class="gear-panel-content">
                <div class="gear-section">
                    <h4>Zeilen</h4>
                    <div class="gear-table" id="sailsTable">
                        <!-- Gevuld door JS -->
                    </div>
                </div>
                <div class="gear-section">
                    <h4>Boards</h4>
                    <div class="gear-table" id="boardsTable">
                        <!-- Gevuld door JS -->
                    </div>
                </div>
            </div>
        </div>
        <div class="gear-overlay" id="gearOverlay"></div>

        <main class="main-grid">
            <!-- Huidige condities -->
            <section class="card current-conditions">
                <h2><span id="conditionsTitle">Nu</span> <span class="conditions-time" id="conditionsTime"></span></h2>
                <div class="current-grid">
                    <!-- Wind -->
                    <div class="current-item current-wind">
                        <div class="current-main">
                            <span class="current-value" id="currentSpeed">--</span>
                            <span class="current-unit" id="windUnit">kn</span>
                        </div>
                        <div class="current-label">Wind</div>
                    </div>

                    <!-- Windrichting -->
                    <div class="current-item current-direction">
                        <div class="current-main">
                            <span class="direction-arrow" id="directionArrow">↓</span>
                            <span class="current-value direction-degrees" id="directionDegrees">--°</span>
                        </div>
                        <div class="current-label" id="directionText">--</div>
                    </div>

                    <!-- Golfhoogte -->
                    <div class="current-item">
                        <div class="current-main">
                            <span class="current-value" id="waveHeight">--</span>
                            <span class="current-unit">m</span>
                        </div>
                        <div class="current-label">Golfhoogte</div>
                    </div>

                    <!-- Golfperiode -->
                    <div class="current-item">
                        <div class="current-main">
                            <span class="current-value" id="wavePeriod">--</span>
                            <span class="current-unit">s</span>
                        </div>
                        <div class="current-label">Periode</div>
                    </div>

                    <!-- Golfrichting -->
                    <div class="current-item">
                        <div class="current-main">
                            <span class="current-value" id="waveDirection">--</span>
                        </div>
                        <div class="current-label">Golfrichting</div>
                    </div>

                    <!-- Getijden -->
                    <div class="current-item current-tide">
                        <div class="tide-times">
                            <div class="tide-next">
                                <span class="tide-icon" id="tideIcon">↑</span>
                                <span class="tide-time" id="nextTideTime">--:--</span>
                                <span class="tide-type" id="nextTideType">HW</span>
                            </div>
                            <div class="tide-after">
                                <span class="tide-icon" id="tideIconAfter">↓</span>
                                <span class="tide-time" id="afterTideTime">--:--</span>
                                <span class="tide-type" id="afterTideType">LW</span>
                            </div>
                        </div>
                        <div class="current-label">Getij</div>
                    </div>
                </div>

                <!-- Gear advies -->
                <div class="gear-advice" id="gearAdvice">
                    <span class="gear-sail" id="gearSail">--</span>
                    <span class="gear-board" id="gearBoard">--</span>
                </div>
            </section>

            <!-- 96-uurs grafiek (48u terug + 48u vooruit) -->
            <section class="card forecast-card">
                <h2>Wind & Golven <span class="chart-range" id="chartRange">← swipe →</span></h2>
                <div class="chart-scroll-container" id="chartScrollContainer">
                    <div class="chart-inner" id="chartInner">
                        <canvas id="forecastChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Meerdaagse voorspelling (optioneel) -->
            <section class="card weekly-card">
                <h2>Komende dagen</h2>
                <div class="weekly-forecast" id="weeklyForecast">
                    <!-- Wordt gevuld door JS -->
                </div>
            </section>
        </main>

        <!-- AI Chat (uitgeschakeld) -->

        <aside class="chat-container" id="chatContainer">

                <span class="chat-toggle-icon">💬</span>

            </button>
            <div class="chat-panel" id="chatPanel">
                <div class="chat-header">
                    <h3>Wind Assistent</h3>

                </div>
            </div>
        </aside>
        -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="spots.js"></script>
    <!-- <script src="chat.js"></script> -->
    <script src="app.js"></script>
</body>
</html>
